name: Reproducible unsigned APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Fetch original input
        env:
          ORIGINAL_APK_URL: ${{ secrets.ORIGINAL_APK_URL }}
        run: |
          test -n "$ORIGINAL_APK_URL"
          mkdir -p input
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --max-time 180 "$ORIGINAL_APK_URL" -o input/original.zip
      - name: Tests and two clean builds
        run: |
          node --version
          java -version
          node --test tests/*.test.mjs
          node build.mjs input/original.zip --repro-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Derriumuts-Unleashed-unsigned
          path: output/
          if-no-files-found: error
          retention-days: 7
